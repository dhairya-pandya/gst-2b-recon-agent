[project]
name = "gst-recon-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "openpyxl>=3.1.5",
  "pdfplumber>=0.11.10",
  "rapidfuzz>=3.14.6",
  "langgraph>=1.2.22",
  "pyjwt>=2.15.1",
  "python-multipart>=0.0.34",
  "google-genai>=3.4.0",
]

[dependency-groups]
dev = [
  "pytest>=8",
  "httpx>=0.27",
  "ruff>=0.6",
  "mypy>=1.11",
  "reportlab>=5.1.0",
  "types-openpyxl>=3.1.5.20261017",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"app/main.py" = ["B008"]  # FastAPI Form/File defaults are idiomatic

[tool.mypy]
strict = true
python_version = "3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
